[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ─────────────────────────────────────────────────────────────────────────────
# Environment Variables — paste your values in Railway Dashboard > Variables
# ─────────────────────────────────────────────────────────────────────────────
[environments.production.variables]

# Railway sets PORT automatically — do not change
PORT = "3001"

# Your Railway service public URL (Settings > Networking > Public URL)
# Set this AFTER first deploy so Telegram webhook registers correctly
PUBLIC_URL = ""

# ── AI (analysis only — no trades are executed) ──────────────────────────────
GEMINI_API_KEY = ""

# Set NA if you don't want to use these providers
XAI_API_KEY = "NA"
OPENAI_API_KEY = "NA"

# ── Market Data APIs ─────────────────────────────────────────────────────────
# Set NA if you don't have the key yet — add later when ready
DOME_API_KEY = "NA"
DFLOW_API_KEY = "NA"

# ── Telegram ─────────────────────────────────────────────────────────────────
TELEGRAM_BOT_TOKEN = ""
TELEGRAM_ALERT_CHAT_ID = ""

# ── Arbitrage Scanner Settings ───────────────────────────────────────────────
ARB_MIN_PROFIT_PCT = "3"
ARB_MIN_VOLUME = "10000"
ARB_SCAN_LIMIT = "50"
ARB_AI_MODEL = "gemini-2.5-flash"
